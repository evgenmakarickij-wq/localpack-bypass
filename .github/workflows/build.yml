name: Build mod

on:
  push:
    # Every line of the mod builds here, not just the stable one: a port is only as good as the
    # compiler that checked it, and there is no local one.
    branches: [ main, beta, main1.21.10, beta1.21.10 ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Minecraft 26.1 and newer run on Java 25, and so do the branches that build them. 1.21.10 is
      # a Java 21 game: the branch carrying it says so in its name, and so does a tag for it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ contains(github.ref_name, '1.21.10') && '21' || '25' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # A tag such as v0.0.3 builds exactly that version; a plain push to main keeps
      # whatever gradle.properties currently says.
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gradle build --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            gradle build --no-daemon
          fi

      # Only the mod jar: the -sources jar Loom also produces is not what players install,
      # and publishing it as the run's artifact only leads to the wrong file being downloaded.
      - uses: actions/upload-artifact@v4
        with:
          name: localpack-bypass-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # In-game updates read update.json from the newest release: it names the jar to fetch
      # and the SHA-256 the mod verifies it against.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar="build/libs/localpack-bypass-${version}.jar"

          if [ ! -f "${jar}" ]; then
            echo "::error::Expected ${jar}, but build/libs contains:"
            ls -1 build/libs
            exit 1
          fi

          sha="$(sha256sum "${jar}" | cut -d' ' -f1)"
          printf '{\n  "version": "%s",\n  "file": "localpack-bypass-%s.jar",\n  "sha256": "%s"\n}\n' \
            "${version}" "${version}" "${sha}" > update.json
          cat update.json

          # Hand-written notes when we have them: .github/release-notes/<version>.md describes what
          # that version contains. Otherwise fall back to the list of commits.
          notes=".github/release-notes/${version}.md"
          if [ -f "${notes}" ]; then
            gh release create "${GITHUB_REF_NAME}" "${jar}" update.json \
              --title "localpack-bypass ${version}" \
              --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" "${jar}" update.json \
              --title "localpack-bypass ${version}" \
              --generate-notes
          fi
