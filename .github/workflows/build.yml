name: Build mod

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      # A tag such as v0.0.3 builds exactly that version; a plain push to main keeps
      # whatever gradle.properties currently says.
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gradle build --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            gradle build --no-daemon
          fi

      # Only the mod jar: the -sources jar Loom also produces is not what players install,
      # and publishing it as the run's artifact only leads to the wrong file being downloaded.
      - uses: actions/upload-artifact@v6
        with:
          name: localpack-bypass-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: localpack-bypass-jar
          path: release-artifact
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar="release-artifact/localpack-bypass-${version}.jar"

          if [ ! -f "${jar}" ]; then
            echo "::error::Expected ${jar}, but the artifact contains:"
            ls -1 release-artifact
            exit 1
          fi

          # Hand-written notes when we have them: .github/release-notes/<version>.md describes what
          # that version contains. Otherwise fall back to the list of commits.
          notes=".github/release-notes/${version}.md"
          if [ -f "${notes}" ]; then
            gh release create "${GITHUB_REF_NAME}" "${jar}" \
              --title "localpack-bypass ${version}" \
              --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" "${jar}" \
              --title "localpack-bypass ${version}" \
              --generate-notes
          fi
