plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Mod Menu, for the config screen. Kept out of the runtime classpath: see the comment below.
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile-only, and deliberately so. Minecraft 26.1 and later ship unobfuscated, so there is no
    // remapping step and this is a plain compileOnly rather than modCompileOnly. The config screen
    // is reached through Mod Menu's "modmenu" entrypoint, which nothing loads unless Mod Menu is
    // installed, so a player without Mod Menu never classloads the one class that names it.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// MIT requires the notice to travel with every copy of the software, and a released jar is one.
tasks.withType(Jar).configureEach {
    from("LICENSE") {
        into "META-INF"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
