plugins {
    // Minecraft 1.21.11 and older are obfuscated, and Loom splits the plugin by that: this is the
    // remapping one. `net.fabricmc.fabric-loom` is the same plugin for 26.1 and newer, where the
    // game ships with its own names and there is nothing to remap.
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Mod Menu, for the config screen. Kept out of the runtime classpath: see the comment below.
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile-only, and deliberately so. The config screen is reached through Mod Menu's "modmenu"
    // entrypoint, which nothing loads unless Mod Menu is installed, so a player without Mod Menu
    // never classloads the one class that names it. The `mod` prefix is what remaps it: the game
    // underneath is obfuscated, so a plain compileOnly would leave Mod Menu's names unremapped and
    // the config screen would fail at runtime rather than at build time.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// MIT requires the notice to travel with every copy of the software, and a released jar is one.
tasks.withType(Jar).configureEach {
    from("LICENSE") {
        into "META-INF"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
